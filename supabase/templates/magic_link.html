<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Your sign-in code</title>
  </head>
  <body
    style="
      margin: 0;
      background: #09090b;
      color: #f4f4f5;
      font-family: Arial, sans-serif;
    "
  >
    <main style="max-width: 520px; margin: 0 auto; padding: 48px 24px">
      <h1 style="font-size: 24px; margin: 0 0 16px">Your sign-in code</h1>
      <p style="color: #a1a1aa; font-size: 16px; line-height: 1.5">
        Enter this code in the sign-in window to continue:
      </p>
      <p
        style="
          font-size: 36px;
          font-weight: 700;
          letter-spacing: 0.24em;
          margin: 32px 0;
        "
      >
        {{ .Token }}
      </p>
      <p style="color: #71717a; font-size: 13px; line-height: 1.5">
        If you did not request this code, you can safely ignore this email.
      </p>
    </main>
  </body>
</html>
